name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      # prepack runs the full check again, then pack:check verifies the tarball.
      - run: npm run pack:check
      - run: npm run install:check -- ./.pack/iyoda-pi-cursor-bridge-*.tgz 1.5.2
      - run: npm run install:check -- ./.pack/iyoda-pi-cursor-bridge-*.tgz 1.6.0
