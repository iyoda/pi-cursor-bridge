name: Bug report
description: Report a reproducible bug
body:
  - type: markdown
    attributes:
      value: |
        Do not file vulnerabilities as issues. Send them to the contact in SECURITY.md.
        Do not paste API keys, auth files, conversation logs, or the contents of a temporary workspace.
  - type: textarea
    attributes:
      label: Summary
      description: Describe what happened.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Include the model ID, Thinking level, and the commands you ran. Leave out secrets.
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Versions of Node, Pi, this package, and the Cursor SDK
      placeholder: Node 22.19.0 / Pi 1.5.2 / pi-cursor-bridge 0.1.0 / @cursor/sdk 1.3.1
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
